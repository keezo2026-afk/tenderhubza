services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenderhub
      POSTGRES_USER: tenderhub
      POSTGRES_PASSWORD: tenderhub_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderhub -d tenderhub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
